      <ellipse cx="0" cy="90" rx="29" ry="6" fill="#fff2dd"/>
      <path d="M0 94 C-16 85 -7 81 0 87 C7 81 16 85 0 94 Z" fill="#c89463"/>
      <path d="M-24 106 Q-22 117 -14 121" stroke="#fff6e8" stroke-width="4" stroke-linecap="round" opacity=".65"/>
      <text x="0" y="174" text-anchor="middle" class="heading" font-size="14" font-weight="600">Cappuccino</text>
    </g>
  </g>
</svg>
