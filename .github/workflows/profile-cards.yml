# Vẽ thẻ Stats + Top ngôn ngữ bằng scripts/cards.mjs (dữ liệu từ GitHub API của chính repo này),
# rồi commit vào profile-cards/ trên nhánh main (chỉ commit khi số liệu thay đổi).
#
# Workflow này KHÔNG dùng `uses:` nào: không actions/checkout, không actions/setup-node,
# không action của bên thứ ba. Chỉ dùng git + node có sẵn trên runner ubuntu-latest của GitHub,
# nên không phụ thuộc vào repo của bất kỳ ai khác.
name: Profile cards

on:
  schedule:
    - cron: "0 0 * * *" # mỗi ngày một lần (7h sáng giờ VN)
  workflow_dispatch:
  # Push bất kỳ thay đổi nào lên main là vẽ lại thẻ (không lọc paths nữa).
  # Commit do chính workflow này push bằng GITHUB_TOKEN sẽ KHÔNG kích hoạt lại workflow,
  # nên không có vòng lặp vô hạn.
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Draw cards and push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          # HIDE_LANGS: "HTML,CSS" # bỏ comment nếu muốn ẩn vài ngôn ngữ
        run: |
          set -euo pipefail

          echo "node $(node --version), git $(git --version)"

          # Tự clone thay cho actions/checkout. Token đưa vào header (không nhét vào URL).
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" repo

          cd repo
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"

          node scripts/cards.mjs profile-cards

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-cards

          if git diff --cached --quiet; then
            echo "Số liệu không đổi, không commit."
          else
            git commit -m "chore: update profile cards"
            git push
          fi
